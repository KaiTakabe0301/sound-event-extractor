[tools]
python = "3.12"
uv = "latest"
betterleaks = "latest"
lefthook = "latest"

[tasks.setup]
description = "Install dependencies and enable the lefthook git hooks (secrets scan)"
run = [
  "uv sync",
  "lefthook install",
]

[tasks.cli]
description = "Run the CLI (append args after --)"
run = "uv run sound-event-extractor"

[tasks.gui]
description = "Launch the desktop GUI"
run = "uv run sound-event-extractor-gui"

[tasks.test]
description = "Run unit tests"
run = "uv run pytest -q"

[tasks.build]
description = "Build a standalone desktop app with PyInstaller (run on each target OS)"
run = "uv run pyinstaller --noconfirm --clean --windowed --name SoundEventExtractor --specpath build --collect-all tensorflow --collect-all tensorflow_hub --collect-all tf_keras --collect-all imageio_ffmpeg packaging/entry_gui.py"

[tasks.scan]
description = "Scan the full git history for leaked secrets"
run = "betterleaks git --redact --verbose"
