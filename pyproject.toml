[project]
name = "sound-event-extractor"
version = "0.0.1"
description = "Detect labeled sound events (e.g. dog barks) in video files and export their time segments as CSV"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=1.26",
    "tensorflow~=2.18",
    "tensorflow-hub>=0.16",
    # tensorflow-hub imports pkg_resources, removed from setuptools >= 81
    "setuptools>=70,<81",
    "imageio-ffmpeg>=0.5",
    "pyside6>=6.7",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pyinstaller>=6.10",
]

[project.scripts]
sound-event-extractor = "sound_event_extractor.cli:main"
sound-event-extractor-gui = "sound_event_extractor.gui:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sound_event_extractor"]
